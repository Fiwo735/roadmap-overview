name: Deploy to GitHub Pages

# Builds the app and publishes it as the repository's GitHub Pages site, at
# https://<owner>.github.io/<repository>/. One-time setup (Settings -> Pages -> Source: GitHub Actions)
# is described in the README ("Deployment").
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Only the default branch is published (a push to any other branch, or a manual run from one, does nothing).
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The site is served from /<repository>/, so every script, style, flag and sample file needs that base.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Check the build carries the base path
        run: grep -q '/${{ github.event.repository.name }}/assets/' dist/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deployment at a time; a newer one waits for the running one instead of cancelling it half-way. The group is on this job (not the
    # workflow) so that runs whose build is skipped (other branches) never take the place of a queued default-branch deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
