<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Summarise a campervan trip on an OpenStreetMap map." />
    <title>Roadmap Overview — campervan trip map</title>
    <script>
      // Apply the theme before first paint so there is no light flash in dark mode.
      // Keep in sync with src/features/theme/theme.ts.
      try {
        var t = localStorage.getItem('roadmap-overview:theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
